name: Generate Bun lock

on:
  push:
    branches:
      - chore/migrate-to-bun

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Generate lockfile from current npm lock
        run: |
          rm -f bun.lock
          bun install --lockfile-only
      - name: Commit Bun lock and remove migration scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm package-lock.json
          git rm .github/workflows/generate-bun-lock.yml
          git add bun.lock
          git commit -m "Generate Bun lock from npm lock"
          git push
